[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dodecaphony"
version = "0.2.2"
description = "Algorithmic composition of modern classical music in the twelve-tone technique"
readme = "README.md"
keywords = [
    "ai_music", "algorithmic_composition", "atonality", "dodecaphony", "serialism", "twelve_tone"
]
urls = {Homepage = "https://github.com/Nikolay-Lysenko/dodecaphony"}
authors = [{name = "Nikolay Lysenko", email = "nikolay-lysenco@yandex.ru"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "pretty-midi>=0.2.10,<0.3",
    "PyYAML>=6,<7",
    "sinethesizer>=0.6,<0.7",
]

[dependency-groups]
dev = [
    {include-group = "test"},
]
test = [
    "codecov>=2.1,<3",
    "coverage>=7.13,<8",
    "pytest>=9,<10",
    "pytest-cov>=7.1,<8",
]

[tool.setuptools]
packages = ["dodecaphony", "dodecaphony.scoring_functions"]

[tool.setuptools.package-data]
"dodecaphony.configs" = ["default_config.yml", "sinethesizer_presets.yml"]

[tool.coverage.run]
branch = true
source = ["dodecaphony"]

[tool.coverage.report]
omit = [
    "*/__main__.py",
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if verbose:",
    "if report:",
    "if .debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "raise RuntimeError",
    "raise AttributeError",
    "raise ValueError",
    "raise TypeError",
    "return NotImplemented",
    "pass",
    "continue",
]
